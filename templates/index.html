<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory — Inventra</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="/inventory">Inventra</a>
    <div class="navbar-actions">
      <a href="/sharedinv" class="btn btn-ghost" style="font-size:13px; padding: 7px 14px;">Shared with me</a>
      <span class="navbar-user">{{ username }}</span>
      <a href="/logout" class="btn btn-ghost" style="font-size:13px; padding: 7px 14px;">Sign out</a>
    </div>
  </nav>

  <!-- Page -->
  <div class="page">

    <!-- Header -->
    <div class="page-header">
      <div>
        <h2>Your Inventory</h2>
        <p style="margin-top: 4px; font-size: 14px;">Track and manage all your items</p>
      </div>
      <button class="btn btn-primary" onclick="openAddPanel()">+ Add item</button>
    </div>

    <!-- Stats Cards -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-label">Total Items</span>
        <span class="stat-value" id="statTotal">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Quantity</span>
        <span class="stat-value" id="statQty">—</span>
      </div>
      <div class="stat-card stat-card--warning" id="statLowCard">
        <span class="stat-label">Low Stock</span>
        <span class="stat-value" id="statLow">—</span>
      </div>
    </div>

    <!-- Alert messages -->
    <div class="alert alert-error" id="errorMsg"></div>
    <div class="alert alert-success" id="successMsg"></div>

    <!-- Share row -->
    <div class="share-row">
      <input id="shareInput" type="text" placeholder="Share inventory with username…" style="max-width: 280px;" />
      <button class="btn btn-ghost" onclick="shareInventory()">Share</button>
      <div class="alert alert-error" id="shareError" style="margin: 0; display:none;"></div>
      <div class="alert alert-success" id="shareSuccess" style="margin: 0; display:none;"></div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Restock Min</th>
            <th>Description</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="invBody">
          <tr id="emptyRow">
            <td colspan="6" style="text-align:center; color: var(--muted); padding: 40px;">
              No items yet. Add your first item above.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Slide-in Edit / Add Panel -->
  <div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <h3 id="panelTitle">Add item</h3>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>

    <div class="panel-body">
      <div class="alert alert-error" id="panelError"></div>

      <input type="hidden" id="panelItemId" />

      <div class="field">
        <label for="panelName">Item name</label>
        <input id="panelName" type="text" placeholder="e.g. Laptop" required />
      </div>

      <div class="field">
        <label for="panelQty">Quantity</label>
        <input id="panelQty" type="number" placeholder="0" min="0" required />
      </div>

      <div class="field">
        <label for="panelRestock">Restock minimum</label>
        <input id="panelRestock" type="number" placeholder="e.g. 5" min="0" />
        <span style="font-size:12px; color: var(--muted); margin-top:4px;">
          We'll flag this item when quantity falls below this number
        </span>
      </div>

      <div class="field">
        <label for="panelDesc">Description</label>
        <textarea id="panelDesc" rows="3" placeholder="Optional notes…"
          style="resize:vertical; font-family:'Outfit',sans-serif; font-size:15px;
                 padding:11px 14px; border:1px solid var(--border); border-radius:8px;
                 background:var(--bg); color:var(--text); outline:none; width:100%;"></textarea>
      </div>
    </div>

    <div class="panel-footer">
      <button class="btn btn-ghost" onclick="closePanel()">Cancel</button>
      <button class="btn btn-primary" id="panelSubmit" onclick="submitPanel()">Save item</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
</body>
</html>
