<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — InvApp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <div class="auth-wrap">
    <div class="card auth-card fade-up">

      <a class="auth-logo" href="/">Inventory App (Hello!)</a>

      <h1>Sign in</h1>
      <p style="margin-top: 8px; margin-bottom: 32px; font-size: 15px;">
        Manage your inventory in one place.
      </p>

      <div class="alert alert-error" id="errorMsg">
        Incorrect username or password. Try again.
      </div>

      <form method="POST">
        <div class="field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="yourname"
            autocomplete="username"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="btn btn-primary btn-full" type="submit" style="margin-top: 8px;">
          Sign in
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create one</a>
      </div>

    </div>
  </div>

</body>
</html>
